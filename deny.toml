[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # rsa via russh and age, no fixed release yet; RSA keys are only used locally
    { id = "RUSTSEC-2023-0071", reason = "no fixed rsa release" },
    # proc macro of i18n-embed-fl via age, build time only
    { id = "RUSTSEC-2026-0173", reason = "no maintained replacement upstream" },
]

[licenses]
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# gtk-rs crate without a license field
[[licenses.clarify]]
crate = "sourceview5"
expression = "MIT"
license-files = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
