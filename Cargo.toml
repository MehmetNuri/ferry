[package]
name = "ferry"
license = "GPL-3.0-or-later"
description = "Move files to and from servers and cloud storage"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
cryptomator-vault = { path = "crates/cryptomator-vault" }
adw = { version = "0.8", package = "libadwaita", features = ["v1_6"] }
aes-gcm = "0.10"
age = { version = "0.11", features = ["ssh", "plugin", "armor"] }
argon2 = "0.5"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "background"] }
aws-config = { version = "1.12.0", default-features = false, features = ["rt-tokio", "default-https-client", "sso", "credentials-process"] }
aws-sdk-cloudfront = { version = "1.135.0", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-sts = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-smithy-http-client = { version = "1.5", features = ["rustls-aws-lc"] }
aws-smithy-runtime-api = { version = "1", features = ["client"] }
aws-smithy-types = { version = "1", features = ["http-body-1-x"] }
hmac = "0.12"
http = "1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "aws-lc-rs", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "system-proxy", "stream", "json", "query"] }
russh = "0.64"
russh-sftp = "3"
rustls-native-certs = "0.8"
aws-sdk-s3 = { version = "1.152.0", default-features = false, features = ["rt-tokio", "default-https-client", "sigv4a"] }
base64 = "0.22"
bytes = "1"
fuser = { version = "0.18.0", default-features = false }
futures-channel = "0.3.34"
futures-util = "0.3.34"
gettext-rs = "0.8.0"
gio = { version = "0.21", features = ["v2_70"] }
gtk = { version = "0.10", package = "gtk4", features = ["v4_16"] }
http-body = "1"
libc = "0.2.190"
md-5 = "0.11"
oo7 = { version = "0.6.0", default-features = false, features = ["tokio", "native_crypto"] }
pbkdf2 = "0.12"
quick-xml = "0.42"
qrcode = { version = "0.14", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.10"
sourceview5 = { version = "0.10", features = ["v5_4"], optional = true }
rustls-pki-types = "1"
suppaftp = { version = "12", features = ["tokio-rustls-aws-lc-rs", "deprecated"] }
tokio-rustls = "0.26"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "fs", "io-util", "sync", "time", "macros", "process"] }
zeroize = "1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[build-dependencies]
glib-build-tools = "0.22.8"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true

[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[features]
default = ["sourceview"]
# needs gtksourceview5 development files
sourceview = ["dep:sourceview5"]

[workspace]
members = [".", "crates/cryptomator-vault"]

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
