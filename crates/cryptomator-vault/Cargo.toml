[package]
name = "cryptomator-vault"
version = "0.1.0"
edition = "2024"
description = "Storage-agnostic implementation of the Cryptomator vault format 8"
license = "GPL-3.0-or-later"

[dependencies]
aes = "0.9.3"
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
aes-kw = "0.3.1"
aes-siv = "0.8.0"
ctr = "0.10.1"
data-encoding = "2.11.1"
getrandom = "0.4.3"
hmac = "0.13.0"
scrypt = { version = "0.12.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
subtle = "2.6.1"
unicode-normalization = "0.1.25"
zeroize = { version = "1.9.0", features = ["derive"] }
